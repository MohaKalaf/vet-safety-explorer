[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetsafety"
# bump on every pipeline change so Databricks never reuses the old wheel
version = "0.2.1"
description = "PySpark pipeline for openFDA animal adverse event reports"
requires-python = ">=3.10"
# pyspark is not listed: Databricks provides it, and installing it there would conflict

[project.scripts]
vetsafety-job = "vetsafety.jobs:main"

[tool.setuptools]
packages = ["vetsafety"]
