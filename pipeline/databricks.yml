# Databricks Asset Bundle: the job defined as code.
#   databricks bundle deploy   then   databricks bundle run vetsafety_pipeline
bundle:
  name: vetsafety

resources:
  jobs:
    vetsafety_pipeline:
      name: vetsafety-pipeline
      # openFDA refreshes weekly; paused until turned on in the Jobs UI
      schedule:
        quartz_cron_expression: "0 0 7 ? * TUE"
        timezone_id: Europe/London
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: setup
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["setup"]
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["bronze"]
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["silver"]
        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["gold"]
        - task_key: export
          depends_on: [{ task_key: gold }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["export"]

targets:
  dev:
    default: true
    mode: development
