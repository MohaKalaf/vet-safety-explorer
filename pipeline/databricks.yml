# Databricks Asset Bundle: the job defined as code.
#   databricks bundle deploy   then   databricks bundle run vetsafety_pipeline
bundle:
  name: vetsafety

resources:
  jobs:
    vetsafety_pipeline:
      name: vetsafety-pipeline
      # openFDA refreshes weekly; paused until turned on in the Jobs UI
      schedule:
        quartz_cron_expression: "0 0 7 ? * TUE"
        timezone_id: Europe/London
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            # 4 (17.3 LTS base) rather than latest: 18+ intermittently fails to read
            # workspace files with Errno 5, which breaks importing vetsafety/*.py
            environment_version: "4"
      tasks:
        - task_key: setup
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["setup", "${workspace.file_path}"]
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["bronze", "${workspace.file_path}"]
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["silver", "${workspace.file_path}"]
        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["gold", "${workspace.file_path}"]
        - task_key: export
          depends_on: [{ task_key: gold }]
          environment_key: default
          spark_python_task:
            python_file: jobs/run.py
            parameters: ["export", "${workspace.file_path}"]

targets:
  dev:
    default: true
    mode: development
