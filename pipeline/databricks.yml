# Databricks Asset Bundle: the job defined as code.
#   databricks bundle deploy   then   databricks bundle run vetsafety_pipeline
bundle:
  name: vetsafety

# The pipeline ships as a wheel built on deploy. Importing loose .py files from
# workspace storage failed with Errno 5, and a wheel is the standard way anyway.
artifacts:
  vetsafety:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps -w dist

resources:
  jobs:
    vetsafety_pipeline:
      name: vetsafety-pipeline
      # openFDA refreshes weekly; paused until turned on in the Jobs UI
      schedule:
        quartz_cron_expression: "0 0 7 ? * TUE"
        timezone_id: Europe/London
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            # wheel tasks on serverless need 4+ (2 can't find the installed wheel)
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
      tasks:
        - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: vetsafety
            entry_point: vetsafety-job
            parameters: ["setup"]
        - task_key: bronze
          depends_on: [{ task_key: setup }]
          environment_key: default
          python_wheel_task:
            package_name: vetsafety
            entry_point: vetsafety-job
            parameters: ["bronze"]
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          python_wheel_task:
            package_name: vetsafety
            entry_point: vetsafety-job
            parameters: ["silver"]
        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          python_wheel_task:
            package_name: vetsafety
            entry_point: vetsafety-job
            parameters: ["gold"]
        - task_key: export
          depends_on: [{ task_key: gold }]
          environment_key: default
          python_wheel_task:
            package_name: vetsafety
            entry_point: vetsafety-job
            parameters: ["export"]

targets:
  dev:
    default: true
    mode: development
